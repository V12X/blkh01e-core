# CI mínimo do núcleo: a suíte inteira (vetores RFC, fuzz, propriedades do ratchet) + varredura
# de segredos em TODO push/PR. Nasceu de auditoria (v12x-scan 2026-08-13): verificação que não
# roda sozinha regride. macOS é obrigatório (CryptoKit não existe em Linux).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo — segredo em commit antigo também é vazamento
      - name: gitleaks (histórico completo)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact
